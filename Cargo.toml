[package]
name = "yet-another-audio-visualiser"
version = "0.3.0"
edition = "2024"
authors = ["L00_Cyph3r <yet-another-audio-visualiser@loo.sh>"]
description = "A yet another audio visualiser with GUI and HTTP controls"
license = "MIT"
repository = "https://github.com/L00Cyph3r/yet-another-audio-visualiser"

[features]
default = []
# Instruments the application with the puffin profiler. Off by default, so normal and release
# builds are unaffected. See `src/profiling.rs` and the "Profiling" section of the README.
profiling = ["dep:puffin", "dep:puffin_http", "dep:puffin_egui"]

[dependencies]
anyhow = { version = "1.0.104" }
egui = { version = "0.37.0", features = ["persistence", "rayon"] }
eframe = { version = "0.37.0", features = ["persistence"] }
rustfft = { version = "6.4.1", features = [] }
log = { version = "0.4.34", features = [] }
env_logger = "0.11.11"
crossbeam-channel = "0.5.16"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sentry = { version = "0.49.5", features = ["logs", "log"] }
clap = { version = "4.6.7", features = ["derive"] }
sysinfo = { version = "0.40.1", features = ["system"] }

# Profiling, only pulled in by the `profiling` feature.
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }
# Only the git version targets egui 0.37. The published puffin_egui 0.30.0 still requires
# egui 0.33, which would pull a second, incompatible copy of egui into the build. Pinned to the
# commit that bumped egui so the dependency cannot drift under us.
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", rev = "39c8970abd6a95871bcaf0d3581c494885f2edd5", optional = true }

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "analyzer"
harness = false

[[bench]]
name = "visualisations"
harness = false

# Release-like build with debug info, so that profilers can resolve symbols and attribute
# samples to source lines. Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", features = [] }
windows-sys = { version = "0.61.2" }
[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
