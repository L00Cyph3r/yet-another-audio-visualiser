[package]
name = "yet-another-audio-visualiser"
version = "0.2.0"
edition = "2024"
authors = ["L00_Cyph3r <yet-another-audio-visualiser@loo.sh"]

[dependencies]
anyhow = { version = "1.0.104" }
egui = { version = "0.37.0", features = ["persistence", "rayon"] }
eframe = { version = "0.37.0", features = ["persistence"] }
rustfft = { version = "6.4.1", features = [] }
log = { version = "0.4.34", features = [] }
env_logger = "0.11.11"
crossbeam-channel = "0.5.16"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
sentry = { version = "0.49.5" }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", features = [] }
[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }
