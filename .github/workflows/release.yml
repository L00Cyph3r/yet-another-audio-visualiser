name: Release

on:
  push:
    # Building on every commit gives early feedback; the release is only published for tags.
    branches:
      - master
    paths:
      - .github
      - assets
      - src
      - Cargo.toml
      - Cargo.lock
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release for (e.g. v0.3.0). The tag must exist on the branch being built.'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Binary / crate name, used to locate the built executable.
  PACKAGE: yet-another-audio-visualiser

# Needed to attach artifacts to the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each entry pairs a runner with the OS/architecture suffix used in the artifact file
        # names, so the downloads in a release are unambiguous (and unique across runners).
        include:
          - os: windows-latest
            suffix: windows-x86_64
          # macOS is built as a single universal binary (arm64 + x86_64) on one runner, so there
          # is only one macOS artifact that runs natively on both Apple Silicon and Intel Macs.
          - os: macos-26
            suffix: macos-universal
          # Ubuntu 24.04 (or newer) is required: the crate's cpal/pipewire backend uses the SPA
          # bindings from libspa 0.10.1, which need PipeWire >= 1.0. Ubuntu 22.04 only ships
          # PipeWire 0.3.48 and fails to build libspa (missing spa_video_info_raw.flags, etc.).
          # See https://github.com/pop-os/cosmic-epoch/issues/280
          - os: ubuntu-24.04
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # The universal macOS binary needs both architectures; the host toolchain only ships arm64.
      - name: Add macOS x86_64 target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # eframe / egui, cpal (ALSA + PipeWire) and sentry (OpenSSL via reqwest)
      # all need system libraries to build on Linux.
      #
      # Note: cpal's pipewire backend builds the pipewire/libspa Rust crates, which generate
      # bindings from the *system* PipeWire headers. Those crates (libspa 0.10.x) require
      # PipeWire >= 1.0, so the runner must be Ubuntu 24.04+ (Ubuntu 22.04's PipeWire 0.3.48
      # is too old and fails to compile libspa).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libssl-dev \
            libgtk-3-dev \
            clang \
            libclang-dev

      # Native build. On macOS this produces the arm64 binary that the universal build is
      # combined with below; the resulting file is overwritten by the universal one.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      # Build the Intel slice and merge it with the native (arm64) slice into one universal
      # binary, so a single macOS download runs natively on both Apple Silicon and Intel Macs.
      - name: Build universal macOS binary
        if: runner.os == 'macOS'
        run: |
          pkg="${{ env.PACKAGE }}"
          cargo build --release --locked --target x86_64-apple-darwin
          # Write to a temporary file first: the destination is also one of the inputs.
          lipo -create \
            "target/release/${pkg}" \
            "target/x86_64-apple-darwin/release/${pkg}" \
            -output "target/release/${pkg}.universal"
          mv "target/release/${pkg}.universal" "target/release/${pkg}"
          lipo -info "target/release/${pkg}"

      # Compute the version (without a leading 'v') for file names.
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "${{ env.PACKAGE }}"
          $ver = "${{ steps.version.outputs.version }}"
          $suffix = "${{ matrix.suffix }}"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item "target/release/${pkg}.exe" "staging/${pkg}.exe"
          Push-Location staging
          try {
            Compress-Archive -Path "${pkg}.exe" -DestinationPath "../${pkg}-${ver}-${suffix}.zip" -Force
          } finally {
            Pop-Location
          }
          $archive = "${pkg}-${ver}-${suffix}.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content "${archive}.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg="${{ env.PACKAGE }}"
          ver="${{ steps.version.outputs.version }}"
          suffix="${{ matrix.suffix }}"
          mkdir -p "staging/${pkg}.app/Contents/MacOS"
          cp "target/release/${pkg}" "staging/${pkg}.app/Contents/MacOS/${pkg}"
          # Build the .app bundle's Info.plist from the committed template.
          sed -e "s/__PACKAGE__/${pkg}/g" -e "s/__VERSION__/${ver}/g" \
            .github/release/Info.plist > "staging/${pkg}.app/Contents/Info.plist"
          (cd staging && tar -czf "../${pkg}-${ver}-${suffix}.tar.gz" "${pkg}.app")
          shasum -a 256 "${pkg}-${ver}-${suffix}.tar.gz" > "${pkg}-${ver}-${suffix}.tar.gz.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pkg="${{ env.PACKAGE }}"
          ver="${{ steps.version.outputs.version }}"
          suffix="${{ matrix.suffix }}"
          mkdir -p staging
          cp "target/release/${pkg}" "staging/${pkg}"
          tar -C staging -czf "${pkg}-${ver}-${suffix}.tar.gz" "${pkg}"
          sha256sum "${pkg}-${ver}-${suffix}.tar.gz" > "${pkg}-${ver}-${suffix}.tar.gz.sha256"

      # Optional convenience package. A failure here does not block the release.
      - name: Build Debian package
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install cargo-deb
          deb="${{ env.PACKAGE }}-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.deb"
          cargo deb --no-strip --output="$deb"
          sha256sum "$deb" > "$deb.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Must be unique per matrix job, otherwise the two Linux jobs collide.
          name: ${{ matrix.suffix }}
          path: |
            ${{ env.PACKAGE }}-*.zip
            ${{ env.PACKAGE }}-*.tar.gz
            ${{ env.PACKAGE }}-*.deb
            ${{ env.PACKAGE }}-*.sha256
          if-no-files-found: error

  # Combine all platform artifacts and publish them to the GitHub release.
  # This runs only when every build job has succeeded, and only publishes when the
  # resolved tag looks like a version tag (e.g. "v0.3.0").
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(steps.version.outputs.tag, 'v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Pre-built binaries for Windows, macOS and Linux.

            | Platform | Architecture | Download |
            | --- | --- | --- |
            | Windows | x86_64 | `${{ env.PACKAGE }}-*-windows-x86_64.zip` |
            | macOS | Universal (Apple Silicon + Intel) | `${{ env.PACKAGE }}-*-macos-universal.tar.gz` |
            | Linux | x86_64 | `${{ env.PACKAGE }}-*-linux-x86_64.tar.gz` (or `.deb`) |
            | Linux | arm64 | `${{ env.PACKAGE }}-*-linux-arm64.tar.gz` (or `.deb`) |

            Each archive has a matching `.sha256` file to verify its integrity.

            > On macOS the app is not code-signed, so macOS may warn you about an "unidentified
            > developer" the first time you open it. Right-click the app and choose "Open" to
            > launch it.
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*